<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special For Rii ✨</title>

  <!-- CSS connection -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PAGE 1 : LUXURY WELCOME -->
<section id="page1" class="active">
  <h1>Welcome Riii 🤗✨</h1>
  <p>A luxury surprise made with heart 💙</p>

  <button class="btn" onclick="goPage('page2')">Tap for Surprise 🎁</button>
</section>

<!-- PAGE 2 : SMILES (10 IMAGES) -->
<section id="page2">
  <h2>Your beautiful smiles 💛</h2>

  <div class="photo-full">
    <img src="1.jpeg">
    <img src="2.jpeg">
    <img src="3.jpeg">
    <img src="11.jpeg">
    <img src="5.jpeg">
    <img src="6.jpeg">
    <img src="7.jpeg">
    <img src="12.jpeg">
    <img src="9.jpeg">
    <img src="14.jpeg">
  </div>

  <button class="btn" onclick="goPage('page3')">Next ✨</button>
</section>

<!-- PAGE 3 : MESSAGE -->
<section id="page3">
  <h1>Happy Birthday Madam Ji 🎂💖</h1>
  <p>You deserve all happiness and success 🌸✨</p>

  <button class="btn" onclick="goPage('page4')">Final Surprise 💎</button>
</section>

<!-- PAGE 4 : FINAL PAGE (20 IMAGES) -->
<section id="page4">
  <h2>Memories For You 💙</h2>

  <div class="grid-photos">
    <img src="1.jpeg"><img src="2.jpeg"><img src="3.jpeg"><img src="4.jpeg"><img src="5.jpeg">
    <img src="6.jpeg"><img src="7.jpeg"><img src="8.jpeg"><img src="9.jpeg"><img src="10.jpeg">
    <img src="11.jpeg"><img src="21.jpeg"><img src="13.jpeg"><img src="14.jpeg"><img src="15.jpeg">
    <img src="16.jpeg"><img src="17.jpeg"><img src="18.jpeg"><img src="19.jpeg"><img src="20.jpeg">
  </div>

  <p class="wish">
    Happy Birthday Rii 🥳💖  
    No matter the distance, you’re always special.  
    Keep shining and smiling 🌟💫
  </p>
</section>

<!-- PAGE SWITCH SCRIPT -->
<script>
function goPage(id){
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
